<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="Infografía de las 5S"><rect width="1000" height="720" rx="32" fill="#f7f9fc"/><rect x="28" y="28" width="944" height="664" rx="28" fill="#fff" stroke="#dfe5ee"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#2d3277">¿Qué significa cada S?</text><text x="70" y="128" font-family="Arial,sans-serif" font-size="20" fill="#667085">5S = mantener el lugar de trabajo ordenado, limpio y fácil de usar.</text><g font-family="Arial,sans-serif"><rect x="70" y="170" width="860" height="82" rx="18" fill="#fff8c7" stroke="#ecd95f"/><circle cx="116" cy="211" r="28" fill="#ffe600"/><text x="116" y="221" text-anchor="middle" font-size="30" font-weight="900" fill="#2d3277">1</text><text x="165" y="202" font-size="24" font-weight="800" fill="#172033">SEIRI · Clasificar</text><text x="165" y="231" font-size="19" fill="#667085">Separar lo necesario de lo que no corresponde o estorba.</text><rect x="70" y="268" width="860" height="82" rx="18" fill="#eef4ff" stroke="#c6d5ff"/><circle cx="116" cy="309" r="28" fill="#4c6fff"/><text x="116" y="319" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">2</text><text x="165" y="300" font-size="24" font-weight="800" fill="#172033">SEITON · Ordenar</text><text x="165" y="329" font-size="19" fill="#667085">Cada objeto debe quedar en el lugar que le corresponde.</text><rect x="70" y="366" width="860" height="82" rx="18" fill="#ecfdf3" stroke="#b7e4c7"/><circle cx="116" cy="407" r="28" fill="#22a06b"/><text x="116" y="417" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">3</text><text x="165" y="398" font-size="24" font-weight="800" fill="#172033">SEISO · Limpiar</text><text x="165" y="427" font-size="19" fill="#667085">Mantener el área limpia y retirar objetos o productos del suelo.</text><rect x="70" y="464" width="860" height="82" rx="18" fill="#fff2e8" stroke="#ffcba3"/><circle cx="116" cy="505" r="28" fill="#f79009"/><text x="116" y="515" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">4</text><text x="165" y="496" font-size="24" font-weight="800" fill="#172033">SEIKETSU · Estandarizar</text><text x="165" y="525" font-size="19" fill="#667085">Seguir siempre la misma forma correcta de ordenar y limpiar.</text><rect x="70" y="562" width="860" height="82" rx="18" fill="#f4efff" stroke="#d8c7ff"/><circle cx="116" cy="603" r="28" fill="#7a5af8"/><text x="116" y="613" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">5</text><text x="165" y="594" font-size="24" font-weight="800" fill="#172033">SHITSUKE · Disciplina</text><text x="165" y="623" font-size="19" fill="#667085">Convertir el orden y la limpieza en un hábito de todos los días.</text></g></svg>