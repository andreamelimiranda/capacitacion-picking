  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".18"/></filter>
</defs>
<rect width="800" height="560" fill="url(#bg)"/>
