<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Caja abierta vacía con código Meli en casillero</title>
<desc id="desc">Recreación visual de un casillero de bodega con una caja de producto abierta, vacía y con una etiqueta de código Meli y EAN.</desc>
<defs>
